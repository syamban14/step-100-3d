name: Build and Deploy to VPS via GHCR

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Check if VPS secrets are configured
        id: check_secrets
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USERNAME" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ Secret VPS (VPS_HOST/VPS_USERNAME/VPS_SSH_KEY) belum lengkap di GitHub Secrets. Melewati tahap deploy ke VPS."
          elif printf '%s' "$VPS_SSH_KEY" | grep -qE "^[[:space:]]*(ssh-rsa|ssh-ed25519|ecdsa-sha2|ssh-dss) "; then
            echo "❌ Secret VPS_SSH_KEY terdeteksi sebagai SSH Public Key (.pub), bukan Private Key atau Password SSH."
            echo "👉 Ganti VPS_SSH_KEY dengan isi SSH Private Key (diawali -----BEGIN ... PRIVATE KEY-----) atau Password SSH user VPS Anda."
            exit 1
          else
            echo "configured=true" >> $GITHUB_OUTPUT
            if printf '%s' "$VPS_SSH_KEY" | grep -q "BEGIN "; then
              mkdir -p ~/.ssh && chmod 700 ~/.ssh
              printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
              chmod 600 ~/.ssh/vps_key
              echo "auth_mode=key" >> $GITHUB_OUTPUT
              echo "✅ Secret VPS lengkap (mode autentikasi: SSH Private Key)."
            else
              echo "auth_mode=password" >> $GITHUB_OUTPUT
              echo "✅ Secret VPS lengkap (mode autentikasi: Password / Keyboard-Interactive SSH)."
              command -v sshpass >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
            fi
          fi

      - name: Checkout repository
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Deploy docker-compose.yml & run container on VPS
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          SSHPASS: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          SSH_OPTS="-p ${VPS_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25"
          SCP_OPTS="-P ${VPS_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25"
          REMOTE="${VPS_USERNAME}@${VPS_HOST}"

          if [ "${{ steps.check_secrets.outputs.auth_mode }}" = "key" ]; then
            ssh $SSH_OPTS -i ~/.ssh/vps_key "$REMOTE" "mkdir -p ~/step-100-3d"
            scp $SCP_OPTS -i ~/.ssh/vps_key docker-compose.yml "$REMOTE:~/step-100-3d/docker-compose.yml"
            ssh $SSH_OPTS -i ~/.ssh/vps_key "$REMOTE" "cd ~/step-100-3d && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
          else
            SSH_PASS_OPTS="$SSH_OPTS -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no"
            SCP_PASS_OPTS="$SCP_OPTS -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no"
            sshpass -e ssh $SSH_PASS_OPTS "$REMOTE" "mkdir -p ~/step-100-3d"
            sshpass -e scp $SCP_PASS_OPTS docker-compose.yml "$REMOTE:~/step-100-3d/docker-compose.yml"
            sshpass -e ssh $SSH_PASS_OPTS "$REMOTE" "cd ~/step-100-3d && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
          fi
